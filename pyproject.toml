[project]
name = "scidoc"
version = "0.1.0"
description = "SciDoc OCR — open-source Mathpix alternative (PySide6 desktop app) for scientific documents, powered by Xiaomi-OCR-0."
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
  "PySide6>=6.8",
  "httpx>=0.27",
  "pypdfium2>=4.30",
  "pillow>=10.4",
  "markdown-it-py>=3.0",
]

[project.optional-dependencies]
# Local engine profiles — pick exactly ONE (they pull different PyTorch builds):
#   uv sync --extra mps    macOS Apple Silicon (Metal)
#   uv sync --extra cuda   NVIDIA GPU, Linux/Windows (CUDA 13.0 wheels)
#   uv sync --extra cpu    any OS, no GPU
#   AMD ROCm: planned — manual experimental install, see README.
# Versions are the combination verified on the Xiaomi-OCR-0 model card.
mps  = ["transformers==5.17.0", "accelerate", "torch==2.14.0", "torchvision==0.29.0"]
cuda = ["transformers==5.17.0", "accelerate", "torch==2.14.0", "torchvision==0.29.0"]
cpu  = ["transformers==5.17.0", "accelerate", "torch==2.14.0", "torchvision==0.29.0"]
# Back-compat alias: PyPI torch (MPS on macOS, CUDA on Linux, CPU on Windows).
local = ["transformers==5.17.0", "accelerate", "torch==2.14.0", "torchvision==0.29.0"]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
scidoc = "scidoc.cli:main"

[project.gui-scripts]
scidoc-app = "scidoc.app.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scidoc"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
conflicts = [[
  { extra = "mps" }, { extra = "cuda" }, { extra = "cpu" }, { extra = "local" },
]]

[tool.uv.sources]
torch = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cu130", extra = "cuda" },
  { index = "pytorch-cpu", extra = "cpu" },
]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
